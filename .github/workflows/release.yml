name: Phát hành EXE Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      TEMPLATE_STUDIO_HOME: ${{ github.workspace }}/.runtime/ci-data
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Kiểm tra tag khớp mã nguồn
        shell: pwsh
        run: |
          $version = python -c "from template_studio.version import VERSION; print(VERSION)"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag không khớp phiên bản source.' }
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: python tools/prepare_media.py --home .runtime/ci-data
      - run: python -m ruff check template_studio template_gui.py build_template.py tools tests --select F
      - run: python -m unittest discover -s tests -v
      - run: python template_gui.py --check --library --capture .runtime/gallery.png
      - run: python template_gui.py --check --capture .runtime/production.png
      - run: python build_template.py
      - name: Kiểm tra EXE đã đóng gói
        shell: pwsh
        run: |
          $app = Start-Process -FilePath release/template-studio/TemplateStudio/TemplateStudio.exe -ArgumentList '--check' -PassThru -Wait -WindowStyle Hidden
          if ($app.ExitCode -ne 0) { throw 'EXE không vượt qua kiểm tra khởi động.' }
          $worker = Join-Path $env:TEMPLATE_STUDIO_HOME 'worker-ci'
          New-Item -ItemType Directory -Force -Path $worker | Out-Null
          @{action='health';structural=$true} | ConvertTo-Json | Set-Content (Join-Path $worker 'request.json') -Encoding utf8
          $app = Start-Process -FilePath release/template-studio/TemplateStudio/TemplateStudio.exe -ArgumentList @('--render-worker','--request',(Join-Path $worker 'request.json')) -PassThru -Wait -WindowStyle Hidden
          if ($app.ExitCode -ne 0) { throw 'Worker EXE không khởi động được.' }
          $result = Get-Content (Join-Path $worker 'result.json') -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Worker EXE báo lỗi.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TemplateStudio-windows-x64
          path: release/template-studio/TemplateStudio-windows-x64.zip*
      - name: Tạo GitHub Release
        shell: pwsh
        run: |
          $draft = gh release view $env:RELEASE_TAG --repo '${{ github.repository }}' --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $draft -eq 'false') {
            Write-Output 'Bản này đã public; không ghi đè asset đã phát hành.'
            exit 0
          }
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --draft --target '${{ github.sha }}' --title "Beta Render $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Không tạo được release.' }
          }
          gh release upload $env:RELEASE_TAG release/template-studio/TemplateStudio-windows-x64.zip release/template-studio/TemplateStudio-windows-x64.zip.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Không tải được gói phát hành.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Không public được release đã tải đủ asset.' }
