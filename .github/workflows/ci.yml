name: Kiểm tra Windows
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
      TEMPLATE_STUDIO_HOME: ${{ github.workspace }}/.runtime/ci-data
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python tools/prepare_media.py --home .runtime/ci-data
      - run: python -m ruff check template_studio template_gui.py build_template.py tools tests --select F
      - run: python -m ruff check CapCut_FFmpeg_Codex_Handoff/work --select F
      - run: python -m compileall -q CapCut_FFmpeg_Codex_Handoff/work
      - run: python -m unittest discover -s tests -v
      - run: python template_gui.py --check --library --capture .runtime/gallery.png
      - run: python template_gui.py --check --capture .runtime/production.png
